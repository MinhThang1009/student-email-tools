name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare_runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.runtime.outputs.matrix }}
      canary: ${{ steps.runtime.outputs.canary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load reviewed Python support policy
        id: runtime
        run: python scripts/ci_runtime.py >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: prepare_runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ${{ fromJSON(needs.prepare_runtime.outputs.matrix)['python-version'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint and type-check
        shell: bash
        run: |
          python -m ruff check email_tools emails.py 10lines.py scripts/ci_runtime.py tests
          python -m ruff format --check email_tools emails.py 10lines.py scripts/ci_runtime.py tests
          python -m mypy --ignore-missing-imports email_tools emails.py 10lines.py scripts/ci_runtime.py
      - name: Test
        shell: bash
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=100

  package-build:
    name: package-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Build source and wheel distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "build==1.6.1"
          python -m build --sdist --wheel --outdir "$RUNNER_TEMP/package-dist"

  latest-runtime-canary:
    name: Latest Python runtime canary
    needs: prepare_runtime
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.prepare_runtime.outputs.canary }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run canary tests
        run: python -m pytest -q

  ci-success:
    name: ci-success
    needs: [test, package-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all matrix jobs passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_BUILD_RESULT: ${{ needs.package-build.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ] ||
            [ "$PACKAGE_BUILD_RESULT" != "success" ]; then
            echo "CI checks failed: test=$TEST_RESULT package-build=$PACKAGE_BUILD_RESULT"
            exit 1
          fi
          echo "All CI checks passed."
